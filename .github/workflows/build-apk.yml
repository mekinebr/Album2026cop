name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar web para Android
        run: npx cap sync android

      - name: Gerar APK debug instalável
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: album-copa2026-apk-instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
