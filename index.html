<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Álbum de Figurinhas</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="mini">Controle do álbum</p>
        <h1>Meu Álbum</h1>
      </div>
      <button id="toggleTheme" class="icon-btn" title="Modo escuro">🌙</button>
    </header>

    <section class="dashboard">
      <div class="progress-card">
        <div class="progress-head">
          <div>
            <p class="mini">Progresso geral</p>
            <h2 id="progressText">0%</h2>
          </div>
          <span>🏆</span>
        </div>
        <div class="bar"><div id="progressBar"></div></div>
        <p id="progressInfo" class="muted">0 de 0 figurinhas completas</p>
      </div>

      <div class="stats-grid">
        <article class="stat have"><span>✅</span><b id="haveCount">0</b><small>Tenho</small></article>
        <article class="stat missing"><span>❌</span><b id="missingCount">0</b><small>Faltam</small></article>
        <article class="stat repeat"><span>🔁</span><b id="repeatCount">0</b><small>Repetidas</small></article>
        <article class="stat total"><span>📒</span><b id="totalCount">0</b><small>Total</small></article>
      </div>
    </section>

    <section class="panel">
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Buscar por número, jogador ou time" />
        <select id="statusFilter">
          <option value="todos">Todos</option>
          <option value="tenho">Tenho</option>
          <option value="falta">Falta</option>
          <option value="repetida">Repetida</option>
        </select>
      </div>
    </section>

    <section class="panel form-panel">
      <h3>Adicionar figurinha</h3>
      <form id="playerForm">
        <div class="form-grid">
          <input id="numero" type="number" placeholder="Nº da figurinha" required />
          <input id="nome" type="text" placeholder="Nome do jogador" required />
          <input id="time" type="text" placeholder="Time / Seleção" required />
          <input id="posicao" type="text" placeholder="Posição" />
          <input id="foto" type="url" placeholder="Link da foto do jogador (opcional)" />
          <input id="escudo" type="url" placeholder="Link do escudo do time (opcional)" />
          <select id="status" required>
            <option value="tenho">✅ Tenho</option>
            <option value="falta">❌ Falta</option>
            <option value="repetida">🔁 Repetida</option>
          </select>
          <button type="submit">Salvar</button>
        </div>
      </form>
    </section>

    <section class="list-head">
      <h3>Figurinhas</h3>
      <button id="clearAll" class="danger">Limpar tudo</button>
    </section>

    <main id="playersList" class="players-list"></main>
  </div>

  <nav class="bottom-nav">
    <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠<span>Início</span></a>
    <a href="#searchInput">🔍<span>Buscar</span></a>
    <a href="#playerForm">➕<span>Adicionar</span></a>
    <a href="#playersList">📋<span>Lista</span></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
